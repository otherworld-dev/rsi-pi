[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RSIPI"
version = "0.2.0"
description = "Robot Sensor Interface Python Integration (RSIPI) for KUKA RSI control"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name="Adam Morgan", email="contact@otherworld.dev" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.22",
  "matplotlib>=3.5",
  "lxml>=4.9",
  "scipy>=1.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the RSI contexts. They are data rather than code, so without this an
# installed RSIPI has no config to run against - RSIPI.context() resolves to
# these files.
[tool.setuptools.package-data]
RSIPI = ["contexts/*.rsi", "contexts/*.xml", "contexts/*.diagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]