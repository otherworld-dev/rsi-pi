[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RSIPI"
version = "0.3.0"
description = "Robot Sensor Interface Python Integration (RSIPI) for KUKA RSI control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name="Adam Morgan", email="contact@otherworld.dev" }
]
keywords = ["KUKA", "RSI", "robot", "robotics", "industrial-robot", "real-time", "KRL"]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.22",
  "matplotlib>=3.5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/otherworld-dev/rsi-pi"
Repository = "https://github.com/otherworld-dev/rsi-pi"
Documentation = "https://rsipi.otherworld.dev"
Changelog = "https://github.com/otherworld-dev/rsi-pi/blob/main/CHANGELOG.md"
Issues = "https://github.com/otherworld-dev/rsi-pi/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the RSI contexts. They are data rather than code, so without this an
# installed RSIPI has no config to run against - RSIPI.context() resolves to
# these files.
[tool.setuptools.package-data]
RSIPI = ["contexts/*.rsi", "contexts/*.xml", "contexts/*.diagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "soak: minutes-long loopback run, skipped unless RSIPI_SOAK_SECONDS is set",
]
