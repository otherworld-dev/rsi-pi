name: Publish to PyPI

# Builds the sdist and wheel, checks them, and uploads to PyPI with trusted
# publishing (OIDC) - no API token is stored anywhere. Runs when a GitHub
# release is published, or by hand from the Actions tab.
#
# One-time setup on pypi.org (project RSIPI -> Manage -> Publishing -> GitHub):
#   owner: otherworld-dev   repository: rsi-pi
#   workflow: publish.yml   environment: pypi
#
# Actions are pinned to commit SHAs (the comment is the release they were
# taken from). The "pypi" environment requires reviewer approval and only
# accepts v* tags, so an upload always needs a human click.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Release tag must match the package version
        if: github.event_name == 'release'
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "release tag $GITHUB_REF_NAME does not match pyproject version $ver"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel imports and ships its contexts
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import RSIPI; print(RSIPI.__version__, RSIPI.context('joints'))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/RSIPI/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
