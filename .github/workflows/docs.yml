name: Docs

# Builds the MkDocs site with strict link checking and publishes the result
# to the gh-pages branch (generated HTML only, no history of its own worth
# keeping). Hostinger's Git deployment pulls that branch into the document
# root of rsipi.otherworld.dev; the webhook hPanel provides is registered on
# this repo so every push here redeploys there.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - src/RSIPI/**
      - CHANGELOG.md
      - LICENSE
      - pyproject.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build site and push gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the docs toolchain
        run: python -m pip install -e ".[docs]"
      - name: Build with strict link checking
        run: mkdocs build --strict
      - name: Publish the built site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          full_commit_message: "site: ${{ github.sha }}"
